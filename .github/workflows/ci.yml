name: ci

# The golden replays must give the same bits on every platform: a replay that passes on one machine proves nothing
# about another. Linux x64 and macOS arm64 run the unit tests, the replays and a desync check.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: port
      - run: bun run test
        working-directory: port
